<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>About — Emily Bei Cheng</title>
    <meta name="description" content="Hi, I’m Emily Bei Cheng. I explore life at photo pace and share my experiences through words and images: painting a mural in the Paris Catacombs, getting lost…" />
    <link rel="canonical" href="https://emilybei.com/about.html" />
    <meta property="og:type" content="profile" />
    <meta property="og:title" content="About — Emily Bei Cheng" />
    <meta property="og:description" content="Hi, I’m Emily Bei Cheng. I explore life at photo pace and share my experiences through words and images: painting a mural in the Paris Catacombs, getting lost…" />
    <meta property="og:url" content="https://emilybei.com/about.html" />
    <meta property="og:site_name" content="Emily Bei Cheng" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="About — Emily Bei Cheng" />
    <meta name="twitter:description" content="Hi, I’m Emily Bei Cheng. I explore life at photo pace and share my experiences through words and images: painting a mural in the Paris Catacombs, getting lost…" />
    <link rel="preload" href="/fonts/inconsolata-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/css/style.css" />
    <style>
      .about-layout {
        display: flex;
        gap: 48px;
        align-items: flex-start;
        flex-wrap: wrap;
        margin-top: 20px;
      }

      .about-text {
        flex: 1 1 360px;
      }

      .tagline {
        font-style: italic;
        color: #000;
        font-size: 1.1rem;
        margin: 0 0 24px;
      }

      .about-body p {
        color: #000;
        font-size: 1.05rem;
        line-height: 1.5;
        margin: 0 0 24px;
      }

      .about-body a {
        color: red;
      }

      .about-photo {
        flex: 1 1 360px;
        max-width: 480px;
        margin-top: 40px;
      }

      .photo-carousel {
        position: relative;
        overflow: hidden;
        aspect-ratio: 4 / 5;
      }

      .carousel-track {
        display: flex;
        height: 100%;
        transition: transform 0.4s ease;
      }

      .carousel-track img {
        flex: 0 0 100%;
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .carousel-arrow {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        border: none;
        background: rgba(255, 255, 255, 0.35);
        color: #000;
        font-size: 22px;
        font-weight: bold;
        line-height: 1;
        padding: 10px 14px;
        cursor: pointer;
      }

      .carousel-arrow:hover {
        color: red;
      }

      .carousel-prev {
        left: 0;
      }

      .carousel-next {
        right: 0;
      }

      .splash-stamp {
        position: fixed;
        right: 45px;
        bottom: 15px;
        width: 90px;
        height: auto;
        pointer-events: none;
        z-index: 2;
      }

      @media (max-width: 700px) {
        .splash-stamp {
          width: 56px;
          right: 28px;
          bottom: 6px;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <header>
        <a id="logo" href="/" data-site-name>Emily Bei Cheng</a>
        <nav>
          <a href="work.html">Photoblog</a> /
          <a href="art.html">Art</a> /
          <a href="shop.html">Shop</a> /
          <a href="about.html">About</a>
          <span id="cart-nav-item" hidden> / <a href="cart.html" id="cart-badge">Cart</a></span>
        </nav>
      </header>

      <main>
        <div class="about-layout">
          <div class="about-photo">
            <div class="photo-carousel" id="photo-carousel">
              <div class="carousel-track" id="carousel-track"></div>
              <button type="button" class="carousel-arrow carousel-prev" id="carousel-prev" aria-label="Previous photo">❬</button>
              <button type="button" class="carousel-arrow carousel-next" id="carousel-next" aria-label="Next photo">❭</button>
            </div>
          </div>
          <div class="about-text">
            <h1 class="tagline" id="tagline"></h1>
            <div class="about-body" id="about-body"></div>
          </div>
        </div>
      </main>
    </div>

    <img class="splash-stamp" src="/images/logo/stamp.svg" alt="" />

    <script src="common.js"></script>
    <script src="cart.js"></script>
    <script>
      loadSite().then((site) => {
        document.getElementById("tagline").textContent = site.tagline || "";
        document.getElementById("about-body").innerHTML = (site.about || "")
          .split(/\n\s*\n/)
          .map((para) => `<p>${para.replace(/\n/g, "<br>")}</p>`)
          .join("");

        const photos = site.aboutPhotos && site.aboutPhotos.length ? site.aboutPhotos : site.photo ? [site.photo] : [];
        const track = document.getElementById("carousel-track");
        const carousel = document.getElementById("photo-carousel");
        const prevBtn = document.getElementById("carousel-prev");
        const nextBtn = document.getElementById("carousel-next");

        if (photos.length === 0) {
          carousel.hidden = true;
        } else {
          track.innerHTML = photos
            .map((src, i) => `<img src="/${src}" alt="${site.name} — photo ${i + 1}" />`)
            .join("");

          let index = 0;
          function goTo(i) {
            index = (i + photos.length) % photos.length;
            track.style.transform = `translateX(-${index * 100}%)`;
          }

          if (photos.length > 1) {
            prevBtn.addEventListener("click", () => goTo(index - 1));
            nextBtn.addEventListener("click", () => goTo(index + 1));
          } else {
            prevBtn.hidden = true;
            nextBtn.hidden = true;
          }
        }
      });
    </script>
  </body>
</html>
