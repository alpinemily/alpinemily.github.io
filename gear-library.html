<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gear Library — Emily Bei Cheng</title>
    <meta name="description" content="Gear I'm happy to lend out. Reach out if you'd like to borrow something." />
    <link rel="canonical" href="https://emilybei.com/gear-library" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Gear Library — Emily Bei Cheng" />
    <meta property="og:description" content="Gear I'm happy to lend out. Reach out if you'd like to borrow something." />
    <meta property="og:url" content="https://emilybei.com/gear-library" />
    <meta property="og:site_name" content="Emily Bei Cheng" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Gear Library — Emily Bei Cheng" />
    <meta name="twitter:description" content="Gear I'm happy to lend out. Reach out if you'd like to borrow something." />
    <link rel="preload" href="/fonts/inconsolata-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/css/style.css" />
    <style>
      .recs {
        max-width: 640px;
        margin: 40px auto 80px;
      }

      .recs h1 {
        text-align: left;
        font-size: 1.6rem;
        margin: 0 0 8px;
      }

      .recs .intro {
        color: #666;
        margin: 0 0 32px;
      }

      .recs h2 {
        font-size: 1.15rem;
        margin: 32px 0 8px;
        border-bottom: 1px solid #000;
      }

      .recs ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      .recs > section > ul > li {
        padding: 10px 0;
        border-bottom: 1px dotted #ccc;
      }

      .recs .ride-name {
        display: block;
      }

      .recs .ride-note {
        color: #666;
      }

      .recs .ride-links a {
        color: red;
        margin-right: 12px;
      }

      .recs .ride-links a:hover {
        color: #000;
      }

      .recs ul ul {
        margin: 6px 0 0 16px;
      }

      .recs ul ul li {
        padding: 3px 0;
      }

      .splash-stamp {
        position: fixed;
        right: 45px;
        bottom: 15px;
        width: 90px;
        height: auto;
        pointer-events: none;
        z-index: 2;
      }

      @media (max-width: 700px) {
        .splash-stamp {
          width: 56px;
          right: 28px;
          bottom: 6px;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <header>
        <a id="logo" href="/" data-site-name>Emily Bei Cheng</a>
        <nav>
          <a href="work">Photoblog</a> /
          <a href="art">Art</a> /
          <a href="misc">Misc</a> /
          <a href="shop">Shop</a> /
          <a href="about">About</a>
          <span id="cart-nav-item" hidden> / <a href="cart" id="cart-badge">Cart</a></span>
        </nav>
      </header>

      <main class="recs">
        <h1>Emily’s gear library WIP</h1>
        <p class="intro">Gear I’m happy to lend out. Reach out if you’d like to borrow something.</p>

        <section>
          <h2>Available to borrow</h2>
          <ul>
            <li>
              <span class="ride-name">Ice axe</span>
            </li>
            <li>
              <span class="ride-name">Steel crampons</span>
            </li>
            <li>
              <span class="ride-name">Tents</span>
            </li>
            <li>
              <span class="ride-name">Stove</span>
            </li>
            <li>
              <span class="ride-name">Trad gear</span>
            </li>
            <li>
              <span class="ride-name">Bikepacking bags</span>
            </li>
          </ul>
        </section>
      </main>
    </div>

    <img class="splash-stamp" src="/images/logo/stamp.svg" alt="" />

    <script src="/common.js"></script>
    <script src="/cart.js"></script>
  </body>
</html>
