    <script>
      const DISPLAY_MS = 4500; // how long each image stays fully visible

      function wait(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms));
      }

      async function loadSplash() {
        const site = await loadSite();
        const images = (site.splashImages || []).filter((entry) => !entry.hidden);
        if (images.length === 0) return;

        const img = document.getElementById("splash-img");

        function loadInto(entry) {
          const src = entry.src || entry;
          const focal = entry.focal || { x: 50, y: 50 };
          return new Promise((resolve) => {
            img.onload = resolve;
            img.onerror = resolve;
            img.style.objectPosition = `${focal.x}% ${focal.y}%`;
            img.src = "/" + src;
          });
        }

        let i = 0;

        // First image: load, then fade in from black.
        await loadInto(images[i]);
        void img.offsetWidth; // flush so the browser registers opacity:0 first
        img.style.opacity = "1";

        if (images.length === 1) return;

        while (true) {
          await wait(DISPLAY_MS);

          // Hard cut to hidden — no fade-out, just skip the transition for
          // this one change.
          img.style.transition = "none";
          img.style.opacity = "0";
          void img.offsetWidth;
          img.style.transition = ""; // restore the CSS transition for the fade-in below

          // Swap the image while it's invisible, then fade the new one in.
          i = (i + 1) % images.length;
          await loadInto(images[i]);
          void img.offsetWidth;
          img.style.opacity = "1";
        }
      }

      loadSplash();
    </script>
  </body>
