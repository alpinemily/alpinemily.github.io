  <body>
    <div class="container">
      <header>
        <a id="logo" href="/" data-site-name>Emily Bei Cheng</a>
        <nav>
          <a href="/work">Photoblog</a> /
          <a href="/art">Art</a> /
          <a href="/misc">Misc</a> /
          <a href="/shop">Shop</a> /
          <a href="/about">About</a>
          <span id="cart-nav-item" hidden> / <a href="/cart" id="cart-badge">Cart</a></span>
        </nav>
      </header>

      <main>
        <h1 class="sr-only">Shop</h1>
        <ul class="shop-list" id="shop-list">
          <li>
            <a href="/shop/graphite-art-print/">
              <img src="/images/1793729216285-9a0d12fd.jpg" alt="Framed graphite art print on a wooden dresser" />
              <div class="product-meta">
                <span class="title">Graphite Art Print</span>
                <div class="price">from $150</div>
              </div>
            </a>
          </li>
          <li>
            <a href="/shop/graphite-original/">
              <img src="/images/1793729216346-00fce5a0.jpg" alt="Framed original graphite drawing hanging on a wall" style="object-position: 50% 0%" />
              <div class="product-meta">
                <span class="title">Original Graphite Drawing</span>
                <div class="price">from $640</div>
              </div>
            </a>
          </li>
          <li>
            <a href="/shop/photo-print/">
              <img src="/images/1793731216283-8c8701c8-opt.jpg" alt="Sunbeams through fog below a line of pine trees on Hawk Hill" />
              <div class="product-meta">
                <span class="title">Photo Print</span>
                <div class="price">from $45</div>
              </div>
            </a>
          </li>
          <li>
            <a href="/shop/marin-headlands-photo-ride/">
              <img src="/images/1793735685677-d3aa59f8-opt.jpg" alt="Cyclist riding a coastal ridge above the ocean in the Marin Headlands" style="object-position: 30% 50%" />
              <div class="product-meta">
                <span class="title">Guided Ride and Photoshoot</span>
                <div class="price">$150 / hour</div>
              </div>
            </a>
          </li>
        </ul>
      </main>
    </div>

    <img class="splash-stamp" src="/images/logo/stamp.svg" alt="" />

    <script src="/common.js"></script>
    <script src="/cart.js"></script>
    <script>
      function priceRange(product) {
        if (product.priceLabel) return product.priceLabel;
        const prices = (product.sizes || []).map((s) => s.price);
        if (!prices.length) return "";
        const min = Math.min(...prices);
        const max = Math.max(...prices);
        return min === max ? `$${min}` : `from $${min}`;
      }

      async function loadProducts() {
        const res = await fetch("/data/products.json");
        const products = (await res.json()).filter((p) => !p.hidden);
        const list = document.getElementById("shop-list");
        list.innerHTML = products
          .map(
            (p, i) => `
          <li>
            <a href="/shop/${encodeURIComponent(p.slug || p.id)}/">
              <img src="/${p.image}" alt="${p.imageAlt || p.title}"${p.imagePosition ? ` style="object-position: ${p.imagePosition}"` : ""}${i >= 8 ? ' loading="lazy"' : ""} />
              <div class="product-meta">
                <span class="title">${p.title}</span>
                <div class="price">${priceRange(p)}</div>
              </div>
            </a>
          </li>
        `,
          )
          .join("");
      }

      loadProducts();
    </script>
  </body>
